<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAOS KARTLARI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#07060f;--navy:#0e1233;--navy2:#181d4d;--v:#8b3dff;--n:#c58bff;--tx:#f3eeff;--mu:#9a95c4;--ok:#35e0a1;--no:#ff5c7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(100% 48% at 50% -8%,#51228c 0%,transparent 65%),radial-gradient(70% 40% at 100% 100%,#10254f 0%,transparent 70%),var(--bg);color:var(--tx);font:500 16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;letter-spacing:.1px;transition:background .25s,color .25s}
#app{max-width:480px;margin:0 auto;padding:18px 18px 40px;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:Unbounded,Manrope,sans-serif;margin:0;line-height:1.05}
h2{font-size:22px}
.mu{color:var(--mu);margin:0}
.hero{position:relative;height:190px;display:grid;place-items:center;margin-top:8px}
.hero i{position:absolute;width:96px;height:132px;border-radius:14px;border:2px solid var(--n);background:linear-gradient(160deg,var(--navy2),#0a0c26);box-shadow:0 0 24px #8b3dff66}
.hero i:nth-child(1){transform:rotate(-16deg) translateX(-70px)}
.hero i:nth-child(2){transform:rotate(14deg) translateX(70px)}
.hero i:nth-child(3){transform:rotate(-2deg);border-color:#ff7bf0;box-shadow:0 0 30px #ff7bf055}
.hero h1{position:relative;font-size:38px;font-weight:900;text-align:center;text-shadow:0 0 22px #b45cff;letter-spacing:.5px}
.b{font:800 16px Manrope,sans-serif;color:#fff;border:1px solid #ffffff18;border-radius:15px;padding:16px 18px;min-height:54px;background:linear-gradient(135deg,#a35bff,#6424d9);box-shadow:0 9px 24px #7130d955;cursor:pointer;width:100%;text-align:center;letter-spacing:.2px;transition:transform .16s,filter .16s,box-shadow .16s}
.b:active{transform:scale(.98)}
.b.s{background:var(--navy2);box-shadow:none;border:1.5px solid #3a3f8f}
.b.g{background:none;box-shadow:none;color:var(--mu)}
.b.ok{background:linear-gradient(135deg,#2fd896,#14a874);color:#04150e;box-shadow:none}
.b.no{background:linear-gradient(135deg,#ff5c7a,#d12a4e);box-shadow:none}
.b[disabled]{opacity:.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.top{display:flex;align-items:center;gap:12px}
.back{background:#252653;color:#fff;border:1px solid #ffffff18;border-radius:14px;width:46px;height:46px;font-size:22px;cursor:pointer;box-shadow:0 5px 15px #0004}
.card{background:linear-gradient(145deg,#22265b,#101333 75%);border:1px solid #a77aff;border-radius:22px;padding:24px 18px;text-align:center;box-shadow:0 18px 45px #07041499,0 0 26px #8b3dff33;animation:flip .35s ease}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
.card .w{font:900 34px Unbounded,sans-serif;margin-bottom:14px;word-break:break-word}
.card .f{display:grid;gap:8px}
.card .f span{background:#2a0f3d;border:1px solid #ff5c7a88;border-radius:10px;padding:8px;font-weight:800;color:#ffb3c1}
.big{font:900 64px Unbounded,sans-serif;text-align:center;text-shadow:0 0 24px #b45cff}
.pan{background:linear-gradient(145deg,#171b42f2,#0e1238f5);border:1px solid #44417c;border-radius:18px;padding:16px;box-shadow:0 10px 28px #03020c55;backdrop-filter:blur(12px)}
.sb{display:flex;flex-wrap:wrap;gap:8px}
.sb span{background:var(--navy2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}.human-av{width:34px;height:34px;display:inline-block;vertical-align:middle;flex:none;filter:none!important;opacity:1!important;overflow:visible}.human-av ellipse{stroke:#fff;stroke-width:1.5}.human-av path,.human-av rect,.human-av circle{opacity:1}.av .human-av{width:48px;height:48px}.pl .av{min-width:58px;height:64px;padding:3px}.lead .human-av{width:38px;height:38px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--navy2);color:#fff;border:1.5px solid #3a3f8f;border-radius:999px;padding:10px 14px;font:700 15px Manrope,sans-serif;cursor:pointer}
.chip.on{background:var(--v);border-color:var(--n)}
.chip[disabled]{opacity:.4}
.pl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pl input,.code{flex:1;min-width:0;background:#090b24;border:1.5px solid #3a3f8f;border-radius:12px;color:#fff;font:700 17px Manrope,sans-serif;padding:12px}
.code{text-align:center;letter-spacing:6px;text-transform:uppercase;font-size:24px;width:100%}
.av,.tm,.x{border:0;border-radius:12px;height:46px;min-width:46px;background:var(--navy2);color:#fff;font:800 15px Manrope,sans-serif;cursor:pointer}
.av{font-size:23px;min-width:66px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.05}.av small{font-size:10px;font-weight:900;letter-spacing:.2px;margin-top:3px}.tm.t1{background:#1c4d8f}.tm.t0{background:#7a2bd6}
.step{display:flex;align-items:center;justify-content:space-between}
.step b{font-size:22px;min-width:40px;text-align:center}
.step button{width:46px;height:46px;border:0;border-radius:12px;background:var(--navy2);color:#fff;font-size:22px;cursor:pointer}
.note{background:#2a1a05;border:1px solid #c98a1b;border-radius:12px;padding:10px 12px;color:#ffd58a;font-size:15px}
.lead{display:flex;justify-content:space-between;padding:10px 4px;border-bottom:1px solid #2b3070;font-weight:700}
.tag{font-size:13px;border-radius:999px;padding:3px 10px;background:#1b3d34;color:var(--ok)}
.tag.so{background:#3a2d12;color:#ffd58a}
.ctr{text-align:center}
.gamebar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;margin:-18px -18px 8px;padding:12px 18px;background:#090817ef;border-bottom:1px solid #6e50a866;backdrop-filter:blur(18px)}
.gamebrand{font:900 12px Unbounded,sans-serif;letter-spacing:1.2px;color:#fff}.gamebrand i{color:#b88cff;font-style:normal}
.gamebar-actions{display:flex;gap:8px}.gamebar-actions button{width:42px;height:42px;border:1px solid #ffffff20;border-radius:13px;background:#24234b;color:#fff;font-size:20px}
.pause-panel{text-align:center;padding:26px 18px}.pause-mark{font:900 28px Unbounded,sans-serif;color:#d6b8ff;text-shadow:0 0 22px #9a4dff88}
.settings-head{padding:8px 4px 4px}.settings-head span{font-size:11px;font-weight:900;letter-spacing:2px;color:#b991ff}.settings-head p{font:800 20px Unbounded,sans-serif;margin:8px 0 14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}.setting-row+.setting-row{border-top:1px solid #ffffff12}.setting-row small{display:block;color:var(--mu);font-size:12px;margin-top:3px}
.toggle{min-width:78px;padding:9px 12px;border-radius:999px;border:1px solid #ffffff20;font-weight:800;color:white;background:#292b4c}.toggle.on{background:#214b43;border-color:#3acb9a;color:#a5ffe0}.toggle.off{background:#4b2636;border-color:#a84d69;color:#ffc0d0}
body[data-theme="blue"]{--v:#287de8;--n:#7bb8ff;--navy:#0c1b36;--navy2:#142d53;background:radial-gradient(100% 48% at 50% -8%,#164a83 0%,transparent 65%),#070b14}
body[data-theme="pink"]{--v:#df4fa8;--n:#ff9bd5;--navy:#2b1029;--navy2:#45183f;background:radial-gradient(100% 48% at 50% -8%,#84245e 0%,transparent 65%),#100711}
body.no-motion *,body.no-motion *:before,body.no-motion *:after{animation:none!important;transition:none!important}
@media(max-width:360px){#app{padding-left:13px;padding-right:13px}.gamebar{margin-left:-13px;margin-right:-13px;padding-left:13px;padding-right:13px}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}

/* KAOS KARTLARI — neon masaüstü/telefon arayüzü */
body{background:radial-gradient(ellipse at 50% 0%,#37105f 0%,#120a2a 38%,#070611 78%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle at 8% 24%,#8a22ff22 0 2px,transparent 3px),radial-gradient(circle at 92% 68%,#ec38ff22 0 2px,transparent 3px),linear-gradient(120deg,transparent 46%,#8a2bff0c 47%,transparent 49%);background-size:130px 130px,170px 170px,100% 100%}
#app{max-width:560px;padding:16px 16px 42px;gap:14px}
.hero{height:210px;margin:0 0 4px;isolation:isolate}
.hero i{width:108px;height:146px;border-radius:17px;border:2px solid #b74aff;background:linear-gradient(145deg,#271044,#0b0820 75%);box-shadow:0 0 25px #a22aff88,inset 0 0 18px #9b37ff22}
.hero i:nth-child(1){transform:rotate(-17deg) translateX(-72px)}
.hero i:nth-child(2){transform:rotate(17deg) translateX(72px)}
.hero i:nth-child(3){border-color:#ff64df;box-shadow:0 0 32px #e43bff88,inset 0 0 18px #d947ff33}
.hero h1{font-size:clamp(34px,10vw,48px);line-height:1.02;letter-spacing:-1.8px;color:#fff;text-shadow:0 3px 0 #421078,0 0 10px #d05cff,0 0 28px #a52cff}
.b{border:1px solid #d59aff66;border-radius:17px;background:linear-gradient(135deg,#a12cff,#6410bb 58%,#390b7b);box-shadow:0 7px 0 #26064d,0 12px 25px #7b22dc55,inset 0 1px 0 #ffffff66}
.b.s{background:linear-gradient(145deg,#20123c,#100c25);border:1px solid #8842c9;box-shadow:0 5px 0 #080513,inset 0 1px 0 #ffffff1c}
.b.g{background:#110b20;border:1px solid #553078;box-shadow:none}
.top{padding:5px 0 8px}
.top h2{font-size:clamp(18px,5vw,23px);text-shadow:0 0 16px #b044ff88}
.back{background:linear-gradient(145deg,#291448,#120b25);border:1px solid #9e50e4;color:#f4dfff}
.card{background:radial-gradient(ellipse at 50% 0%,#42206a,#17102f 64%,#0d0a20);border:1.5px solid #c16aff;border-radius:22px;box-shadow:0 0 0 3px #6719a833,0 14px 35px #0009,0 0 24px #a22cff44}
.pan{background:linear-gradient(145deg,#1d1234ee,#0c0a1fee);border:1px solid #7843a5;box-shadow:0 10px 28px #0007,inset 0 1px 0 #ffffff13}
.chip{background:linear-gradient(145deg,#211238,#100b20);border-color:#70409a}
.chip.on{background:linear-gradient(135deg,#a52fff,#5b16b7);border-color:#e0a8ff;box-shadow:0 0 16px #a52fff88}
.pl input,.code{background:#0c081a;border-color:#70409a}
.gamebar{background:#090512ee;border-color:#8e39c566}
.gamebrand{font-size:13px;color:#fff;text-shadow:0 0 12px #bf59ff}
.note{background:#2a160d;border-color:#e9a13d}
.lead{border-color:#4c2c69}
.sb span{background:linear-gradient(135deg,#281441,#120d25);border:1px solid #62388a}
@media(min-width:700px){#app{max-width:760px;padding-top:24px}.hero{height:240px}.hero h1{font-size:54px}.b{min-height:58px}}
@media(max-width:390px){#app{padding-left:13px;padding-right:13px}.hero{height:185px}.hero i{width:88px;height:126px}.hero i:nth-child(1){transform:rotate(-17deg) translateX(-59px)}.hero i:nth-child(2){transform:rotate(17deg) translateX(59px)}}

/* Kapalı görev kartları: neon mor, logolu arka yüz */
.c18-picks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:18px 0 10px}
.c18-back{position:relative;min-width:0;aspect-ratio:3/4.25;border:1.5px solid #e3a5ff;border-radius:14px;padding:7px 3px;color:#fff;overflow:hidden;cursor:pointer;background:radial-gradient(ellipse at 50% 15%,#6824a0 0%,#251044 48%,#090615 100%);box-shadow:0 0 0 2px #8e2bce55,0 8px 18px #0009,0 0 17px #a42cff77,inset 0 0 18px #c65aff22;transition:transform .18s,filter .18s}
.c18-back:before{content:"";position:absolute;inset:5px;border:1px solid #d18bff88;border-radius:10px;background:repeating-linear-gradient(135deg,transparent 0 8px,#c45aff13 8px 10px)}
.c18-back:after{content:"✦";position:absolute;top:8px;right:9px;color:#ffd5ff;text-shadow:0 0 8px #ed75ff}
.c18-back:active{transform:translateY(-5px) rotate(-2deg);filter:brightness(1.35)}
.c18-card-logo{position:relative;z-index:1;display:flex;min-height:100%;flex-direction:column;align-items:center;justify-content:center;font-family:Unbounded,sans-serif;line-height:1.2;text-shadow:0 0 8px #d86cff,0 0 17px #9b24ff}
.c18-card-logo b{font-size:clamp(9px,2.8vw,14px);letter-spacing:-.5px}
.c18-card-logo i{font-size:clamp(7px,2vw,10px);font-style:normal;letter-spacing:1px;color:#ffc7ff}
.c18-back small{position:absolute;z-index:2;bottom:7px;left:0;right:0;font-weight:900;color:#e7c5ff;font-size:11px}
.c18-reveal{position:relative;overflow:hidden}
.c18-stamp{font:900 10px Unbounded,sans-serif;letter-spacing:2px;color:#d9a5ff;margin-bottom:16px;text-shadow:0 0 12px #c14bff}
.av .human-av{width:54px;height:54px}
.pl .av{min-width:68px;height:70px}
@media(max-width:350px){.c18-picks{gap:5px}.c18-back{border-radius:10px}.c18-card-logo b{font-size:8px}.c18-card-logo i{font-size:6px}}

/* GÖRSEL TEMA: parlak neon mor masa, siyah yok */
body{background:radial-gradient(ellipse at 50% -5%,#7a3dff 0%,#4a1fa8 32%,#2a1370 62%,#1c0d52 100%)!important;background-attachment:fixed}
body:before{background:radial-gradient(circle at 12% 20%,#b58cff44 0 3px,transparent 4px),radial-gradient(circle at 88% 70%,#ff7bf044 0 3px,transparent 4px),linear-gradient(120deg,transparent 44%,#b58cff18 46%,transparent 49%)!important}
.human-av{filter:drop-shadow(0 0 7px #b58cffaa)!important;border-radius:50%}
.av{background:linear-gradient(145deg,#4b2aa6,#2d1672)!important;border:2px solid #b58cffaa!important;border-radius:18px!important;box-shadow:0 0 14px #8b3dff66}
.card{background:radial-gradient(ellipse at 50% 0%,#5a2fb8,#2c1675 70%,#1f0f58)!important;border:2px solid #d6b8ff!important}
.pan{background:linear-gradient(145deg,#3a1f8aee,#25126bee)!important;border:1.5px solid #a77aff!important;box-shadow:0 12px 30px #1a0a4a88,0 0 22px #8b3dff44!important}
.gamebar{background:linear-gradient(180deg,#341a82ee,#2a1570ee)!important;border-bottom:1.5px solid #b58cff88!important}
.gamebar-actions button,.back{background:linear-gradient(145deg,#4b2aa6,#2d1672)!important;border:1.5px solid #b58cff!important}
.b{background:linear-gradient(135deg,#9b5cff,#6a2ee0 60%,#4a1fb0)!important;border:1.5px solid #e0c8ffaa!important}
.b.s{background:linear-gradient(145deg,#3b2090,#26126a)!important;border:1.5px solid #a77aff!important}
.b.g{background:#2c1675!important;border:1.5px solid #7a55d0!important}
.chip{background:linear-gradient(145deg,#3b2090,#26126a)!important;border-color:#a77aff!important}
.sb span,.pl input,.code{background:linear-gradient(135deg,#3b2090,#26126a)!important;border-color:#a77aff!important}
.pl input,.code{background:#26126a!important}
.c18-back{background:radial-gradient(ellipse at 50% 15%,#8a44e8 0%,#4a2399 50%,#241060 100%)!important}

/* MASA DÜZENİ (görsel birebir) */
#app:has(.tbl){max-width:1180px;padding:10px 12px 24px}
.tbl{display:flex;flex-direction:column;gap:12px}
.tb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.tb-l,.tb-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tb-r{justify-content:flex-end}
.tbtn{background:linear-gradient(145deg,#4b2aa6,#2d1672);color:#fff;border:1.5px solid #b58cffcc;border-radius:16px;padding:10px 16px;font:800 15px Manrope,sans-serif;box-shadow:0 0 14px #8b3dff55;cursor:pointer}
.tb-logo{display:flex;flex-direction:column;align-items:center;line-height:.95;position:relative;padding-top:6px}
.tb-logo b{font:900 clamp(20px,5vw,34px) Unbounded,sans-serif;font-style:italic;color:#fff;letter-spacing:-1px;-webkit-text-stroke:1.5px #3b1480;text-shadow:0 3px 0 #5b2bc0,0 0 18px #c58bff}
.tb-logo .crown{position:absolute;top:-8px;left:-6px;font-size:20px;transform:rotate(-14deg)}
.pill{display:flex;align-items:center;gap:8px;background:linear-gradient(145deg,#3b2090,#26126a);border:1.5px solid #a77aff;border-radius:16px;padding:7px 12px;box-shadow:0 0 14px #8b3dff44}
.pill i{font-style:normal;font-size:24px}.pill span{display:flex;flex-direction:column;line-height:1.1}.pill small{color:#c9b2ff;font-weight:700;font-size:11px}.pill b{font:800 18px Manrope,sans-serif}
.tblm{display:grid;grid-template-columns:92px 1fr 92px;gap:14px;align-items:center}
.sl,.sr{display:flex;flex-direction:column;gap:22px;align-items:center}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px}.seat small{font-weight:800;font-size:12px;color:#e6d9ff;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seatav{position:relative;width:74px;height:74px;border-radius:50%;box-shadow:0 0 18px var(--rc),0 0 0 3px #1c0d52}
.seatav .human-av{width:100%;height:100%;filter:none!important}
.seatav .bd{position:absolute;right:-6px;bottom:-4px;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:900 14px Manrope,sans-serif;color:#fff;border:2px solid #fff;text-shadow:0 1px 2px #0008}
.tblc{background:linear-gradient(160deg,#3a1f8aee,#22105fee);border:2px solid #9a6cff;border-radius:34px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px #12063c99,0 0 30px #8b3dff55,inset 0 0 40px #b58cff18;min-height:300px}
.bb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.chat{background:linear-gradient(145deg,#3b2090,#26126a);border:1.5px solid #a77aff;border-radius:18px;padding:12px 16px;color:#c9b2ff;font-weight:700;max-width:420px}
.deck{display:flex;align-items:center;gap:8px;font-size:34px}.deck b{display:grid;place-items:center;min-width:38px;height:38px;border-radius:50%;background:#2d1672;border:2px solid #b58cff;font:900 18px Manrope,sans-serif}
.bb-r{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:700px){.tb{grid-template-columns:1fr 1fr}.tb-logo{grid-column:1/3;grid-row:1;justify-self:center}.tblm{grid-template-columns:1fr}.sl,.sr{flex-direction:row;justify-content:center;gap:16px;flex-wrap:wrap}.sl{order:1}.sr{order:2}.tblc{order:3;border-radius:26px;padding:16px}.seatav{width:60px;height:60px}.bb{grid-template-columns:1fr auto}.deck{display:none}}
/* Cezalı Mod */
.warnb{align-self:center;display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#4b2aa6,#2d1672);border:2.5px solid #b58cff;border-radius:22px;padding:6px 26px 6px 14px;box-shadow:0 0 22px #8b3dff88;margin-top:-34px}
.warnb .tri{font-size:44px;filter:drop-shadow(0 0 8px #ffb300)}.warnb b{font:900 clamp(28px,7vw,44px) Manrope,sans-serif;font-style:italic;color:#fff}
.warnt{text-align:center;margin:0;font-style:italic;font-weight:700;font-size:clamp(15px,3.6vw,20px);color:#efe6ff}.warnt em{color:#ffc933;font-style:italic;font-weight:900}
.c18-picks{gap:clamp(6px,1.6vw,16px)!important;margin:10px 0!important}
.c18-back{border:3px solid #d9c4ff!important;border-radius:16px!important;background:radial-gradient(ellipse at 50% 30%,#5a2fb8 0%,#2a1470 60%,#170a45 100%)!important;box-shadow:0 0 0 2px #7a55d055,0 10px 20px #0008!important}
.c18-back:before,.c18-back:after{display:none!important}
.c18-card-logo b{font-size:clamp(12px,3.4vw,24px)!important;font-style:italic;color:#fff;-webkit-text-stroke:1px #3b1480}.c18-card-logo i{font-size:clamp(8px,2.2vw,15px)!important}
.c18-back.sel{transform:translateY(-10px) scale(1.06);border-color:#fff!important;box-shadow:0 0 26px #d9a5ff,0 12px 24px #000a!important}
.selb{align-self:center;width:min(300px,100%)!important;font-size:20px!important}

/* EFEKTLER */
body{background:radial-gradient(ellipse at 50% -5%,#8a4bff 0%,#4a1fa8 32%,#2a1370 62%,#1c0d52 100%)!important;animation:bgp 12s ease-in-out infinite alternate}
@keyframes bgp{to{background-position:0 30px;filter:hue-rotate(18deg)}}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(circle,#fff6 0 1.5px,transparent 2px) 0 0/90px 90px,radial-gradient(circle,#d9a5ff55 0 2px,transparent 3px) 45px 45px/130px 130px;animation:drift 30s linear infinite}
@keyframes drift{to{background-position:0 -400px,45px -600px}}
.hero i{animation:flt 4s ease-in-out infinite}.hero i:nth-child(2){animation-delay:-1.3s}.hero i:nth-child(3){animation-delay:-2.6s}
@keyframes flt{50%{translate:0 -10px}}
.hero h1,.tb-logo b{background:linear-gradient(100deg,#fff 30%,#ffd5ff 45%,#fff 60%);background-size:250%;-webkit-background-clip:text;background-clip:text;animation:shn 3.5s linear infinite}
@keyframes shn{to{background-position:-250% 0}}
.b,.chip,.tbtn{transition:transform .12s,box-shadow .2s,filter .2s}.b:hover,.chip:hover{filter:brightness(1.15)}.b:active,.chip:active,.tbtn:active{transform:scale(.95)}
.card{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.cf{position:fixed;inset:0;pointer-events:none;z-index:99}
body.shk{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.seatav{animation:brt 3s ease-in-out infinite}@keyframes brt{50%{box-shadow:0 0 28px var(--rc),0 0 0 3px #1c0d52}}
.big{animation:pls 1s ease-in-out infinite}@keyframes pls{50%{transform:scale(1.08)}}

.crests{display:flex;align-items:center;justify-content:center;gap:clamp(10px,4vw,30px);margin:12px 0}.crests>*{display:flex;flex-direction:column;align-items:center}.crest{width:clamp(70px,22vw,110px);filter:drop-shadow(0 6px 10px #0009);animation:flt 3.5s ease-in-out infinite}.crests small{font-weight:800;font-size:12px;color:#e6d9ff;margin-top:4px}.plus{font:900 34px Unbounded,sans-serif;color:#ffd21f;text-shadow:0 0 14px #ffb300}
.tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:10px}.tiles span{width:clamp(28px,8vw,42px);height:clamp(34px,10vw,50px);display:grid;place-items:center;background:linear-gradient(160deg,#fff,#d9c4ff);color:#2a1470;border-radius:10px;font:900 clamp(16px,5vw,24px) Unbounded,sans-serif;box-shadow:0 4px 0 #6a3fd0,0 6px 12px #0006;animation:pop .5s backwards}.tiles span:nth-child(2n){animation-delay:.08s;transform:rotate(-3deg)}.tiles span:nth-child(3n){animation-delay:.16s;transform:rotate(3deg)}
.crests{flex-wrap:nowrap}.crests>.cr{min-width:0;max-width:38%}.crests small{text-align:center;font-size:11px;line-height:1.1}.tblc{min-width:0}.tblm>*{min-width:0}
.whw{position:relative;width:min(300px,80vw);aspect-ratio:1;margin:14px auto}.wh{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;box-shadow:0 0 30px #b25cff;background:conic-gradient(#8b3dff 0 45deg,#ff3fd0 45deg 90deg,#2aa8ff 90deg 135deg,#ff9a1f 135deg 180deg,#8b3dff 180deg 225deg,#ff3fd0 225deg 270deg,#2aa8ff 270deg 315deg,#35c46a 315deg 360deg);transition:transform 4.2s cubic-bezier(.12,.7,.1,1)}.wl{position:absolute;inset:0;display:flex;justify-content:center}.wl span{margin-top:9%;font:900 clamp(16px,5vw,24px) Unbounded,sans-serif;color:#fff;text-shadow:0 2px 4px #000a}.whp{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:3;font-size:32px;color:#ffd21f;filter:drop-shadow(0 0 6px #000)}.gw{display:grid;place-items:center;padding:10px}.gate{width:min(190px,60vw);aspect-ratio:3/4.2;animation:flt 3s ease-in-out infinite}.flipin{animation:flipin .6s}@keyframes flipin{from{transform:rotateY(90deg) scale(.8);opacity:0}to{transform:none;opacity:1}}

S.playing=true;if(S.mode=='yk'){G={tm:[0,1].map(t=>S.players.filter(p=>p.t==t)),i:0,total:S.rounds*2,ptr:[0,0],deck:sh(YK),ts:[0,0]};if(G.tm[0].length<2||G.tm[1].length<2){S.msg='Her takımda en az 2 oyuncu olmalı. Takım düğmelerine dokun.';S.playing=false;return V.setup()}ykReady()}
else if(S.mode=='gk'){G={r:0};gkRound()}else if(S.mode=='ky'){G={r:0};kyRound()}else if(S.mode=='cb'){G={r:0};cbRound()}

function ykReady(){const t=G.i%2;const tm=G.tm[t];G.t=t;G.d=tm[G.ptr[t]%tm.length];G.rule=S.chaos?R(KK):null;
draw(`<p class="mu ctr">Tur ${Math.floor(G.i/2)+1}/${S.rounds} · Takım A ${G.ts[0]} – ${G.ts[1]} Takım B</p><div class="card"><div style="font-size:64px">${avatarHTML(G.d.a)}</div><div class="w">${E(G.d.n)}</div><p class="mu">Takım ${t?'B':'A'} anlatıyor. Takım arkadaşları tahmin eder, rakip takım yasaklı kelimeleri dinler.</p>${G.rule?`<div class="note">🌀 Kaos kuralı: ${E(G.rule)}</div>`:''}</div><button class="b" data-a="ykgo">Başla (${S.dur} sn)</button>`)}

G.votes.forEach((v,i)=>{if(v==G.odd)S.players[i].s+=1});if(!caught)S.players[G.odd].s+=2;
